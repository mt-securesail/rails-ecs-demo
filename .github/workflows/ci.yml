name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run tests
        run: bin/rails test

  brakeman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # Brakeman exits non-zero when it finds warnings. Let this step continue
      # so the results still get uploaded for viewing, then fail the job below.
      # The job's pass/fail result is what the branch ruleset requires.
      - name: Run Brakeman
        id: brakeman
        continue-on-error: true
        run: bundle exec brakeman -f sarif -o brakeman-results.sarif

      - name: Upload Brakeman SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: brakeman-results.sarif
          category: brakeman

      - name: Fail the job if Brakeman found problems
        if: steps.brakeman.outcome == 'failure'
        run: |
          echo "Brakeman reported warnings or errors. See the code scanning results."
          exit 1
