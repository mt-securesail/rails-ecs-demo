name: Secret scan (Gitleaks)

# Scans every commit in a pull request for secrets that GitHub's own secret
# scanning doesn't cover on a personal-account repo: generic ones like private
# keys and passwords in URLs (findings log #27). GitHub's scanning and push
# protection still handle known provider tokens (AWS, GitHub, Stripe, ...).
on:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned release, checked against the release's checksums file (2026-11-15).
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit in the PR, not just the last one
          persist-credentials: false

      - name: Install Gitleaks (pinned version, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # The rules and the ignore list come from the base branch (main), not from
      # this PR, so a PR can't weaken the scan or excuse its own secret. Changes
      # to them take effect after they're reviewed and merged.
      - name: Load the config and ignore list from the base branch
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          if git show "$BASE_SHA:.gitleaks.toml" > "$RUNNER_TEMP/base/gitleaks.toml" 2>/dev/null; then
            echo "Using .gitleaks.toml from the base branch"
          else
            echo "No .gitleaks.toml on the base branch yet: using Gitleaks' built-in rules"
            rm "$RUNNER_TEMP/base/gitleaks.toml"
          fi
          git show "$BASE_SHA:.gitleaksignore" > "$RUNNER_TEMP/base/.gitleaksignore" 2>/dev/null || : > "$RUNNER_TEMP/base/.gitleaksignore"
          echo "Ignored findings: $(grep -cvE '^\s*(#|$)' "$RUNNER_TEMP/base/.gitleaksignore" || true)"

      # Every commit in the PR, so a secret added and then deleted in a later
      # commit is still caught (it stays in the history). The log is public:
      # --redact hides secret values, and only rule, file, line, commit and
      # fingerprint are printed (Gitleaks' own detailed output includes the
      # commit author's email).
      - name: Scan this PR's commits
        run: |
          config=()
          [ -f "$RUNNER_TEMP/base/gitleaks.toml" ] && config=(--config "$RUNNER_TEMP/base/gitleaks.toml")
          status=0
          "$RUNNER_TEMP/gitleaks" git . "${config[@]}" \
            --log-opts="$BASE_SHA..$HEAD_SHA" \
            --gitleaks-ignore-path "$RUNNER_TEMP/base/.gitleaksignore" \
            --redact --no-banner --exit-code 1 \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::error::Gitleaks found possible secrets in this PR's commits (values not shown: this log is public)."
            jq -r '.[] | "  \(.RuleID)  \(.File):\(.StartLine)  commit \(.Commit[0:12])  fingerprint \(.Fingerprint)"' "$RUNNER_TEMP/gitleaks.json"
            echo "If it's a real secret: rotate it first, then remove it from the branch history."
            echo "If it's a false positive: add the fingerprint to .gitleaksignore (in its own PR, merged first) and log it in docs/findings-log.md."
          fi
          exit "$status"
