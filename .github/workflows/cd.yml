name: Deploy to ECS

on:
  push:
    branches: [main]

# Each job below sets its own permissions; this is the default for anything else.
permissions:
  contents: read

# Only one run (CI + deploy) at a time. A newer push waits for the running one
# to finish (and replaces any older waiting one) instead of starting a second
# ECS deployment that supersedes the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_DEFINITION_FAMILY: ${{ vars.ECS_TASK_DEFINITION_FAMILY }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}

jobs:
  # Run the same tests and Brakeman scan as on pull requests (ci.yml),
  # against exactly the commit that is about to be deployed.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write # Brakeman uploads its results to code scanning

  deploy:
    needs: ci # deploy only if every CI job passed
    runs-on: ubuntu-latest
    # id-token: write is required for OIDC — this is what lets Actions get
    # temporary AWS credentials without any AWS access key stored in GitHub.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --build-arg APP_VERSION="$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Fill in new image ID
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # Scan what was just deployed with OWASP ZAP's baseline (passive) scan,
  # through the real ALB. The ALB only allows listed IPs, so this job briefly
  # adds the runner's IP using a separate, narrow AWS role (infra/zap_scan.tf),
  # and always removes it afterwards. Report-only: rule levels are in
  # .zap/rules.tsv. (The PR version of this scan is .github/workflows/zap.yml.)
  zap-production:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af # stable, checked 2026-11-11
      ALB_SG: ${{ vars.ALB_SECURITY_GROUP_ID }}
      APP_URL: ${{ vars.APP_URL }}
      RULE_DESC: zap-scan-run-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (scan role) via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ZAP_SCAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Let this runner through the ALB allow-list
        id: open
        run: |
          ip=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          echo "Runner IP: $ip"
          aws ec2 authorize-security-group-ingress --group-id "$ALB_SG" \
            --ip-permissions "IpProtocol=tcp,FromPort=80,ToPort=80,IpRanges=[{CidrIp=$ip/32,Description=$RULE_DESC}]" > /dev/null
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          # Security group changes take a few seconds to apply.
          for i in $(seq 1 15); do
            if curl -fsS -m 5 "$APP_URL/up" > /dev/null; then echo "ALB reachable"; exit 0; fi
            sleep 4
          done
          echo "ALB not reachable from the runner"; exit 1

      - name: Scan production with ZAP baseline
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          cp .zap/rules.tsv zap-out/rules.tsv
          docker run --rm -v "$PWD/zap-out:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$APP_URL" -c rules.tsv -I -m 1 \
              -r report.html -w report.md -J report.json

      # Runs even if the scan failed or was cancelled. If this step ever fails,
      # remove the rule by hand (AWS Management Console: EC2 → Security Groups →
      # rails-ecs-demo-alb-sg → Inbound rules, description "zap-scan-run-…"),
      # or run terraform apply, which removes rules it doesn't know about.
      - name: Remove the runner from the ALB allow-list
        if: always() && steps.open.outputs.ip != ''
        env:
          RUNNER_IP: ${{ steps.open.outputs.ip }}
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$ALB_SG" \
            --ip-permissions "IpProtocol=tcp,FromPort=80,ToPort=80,IpRanges=[{CidrIp=$RUNNER_IP/32}]" > /dev/null
          echo "Removed $RUNNER_IP/32"

      - name: Add results to the job summary
        if: always() && hashFiles('zap-out/report.md') != ''
        run: cat zap-out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full report
        if: always() && hashFiles('zap-out/report.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-production-report
          path: |
            zap-out/report.html
            zap-out/report.md
            zap-out/report.json
